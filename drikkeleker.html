          <thead><tr><th>Hvem</th><th>Sangtekst</th></tr></thead>
          <tbody>
            ${s.lines.map(l => `
              <tr class="${l.drink ? "is-drink" : ""}">
                <td>${esc(l.who)}</td>
                <td>${esc(l.lyric)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`).join("");

  function toggle(i) {
    document.getElementById("sc-" + i).classList.toggle("is-open");
  }

  function togglePlayer(i) {
    const p = document.getElementById("player-" + i);
    p.style.display = p.style.display === "none" ? "block" : "none";
  }
  </script>
</body>
</html>
