<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM Tipping ⚽ MOMFIES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Outfit:wght@300..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .tip-card {
      background: var(--paper); border: var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 18px 20px; margin-bottom: 14px;
    }
    .tip-card__meta { font-size: .85rem; color: #41566b; font-weight: 700; margin-bottom: 8px; }
    .tip-card__teams {
      font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 14px; line-height: 1.1;
    }
    .tip-card__teams span { display: block; }
    .hub { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .hub__label { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .hub__label span { text-align: center; font-size: .75rem; font-weight: 800; letter-spacing: .08em; color: var(--blue); }
    .hub-btn {
      background: var(--foam); border: 2px solid var(--ink); border-radius: 12px;
      padding: 12px 6px; font-weight: 800; font-size: 1.1rem; cursor: pointer;
      transition: background .12s, transform .1s; text-align: center;
    }
    .hub-btn:hover { background: var(--sky); transform: translateY(-2px); }
    .hub-btn.is-picked { background: var(--blue); color: var(--paper); }
    .hub-btn.is-correct { background: var(--mint); color: var(--ink); }
    .hub-btn.is-wrong { background: var(--coral); color: var(--paper); opacity: .7; }

    .players-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; border-top: 2px solid var(--foam); padding-top: 12px; }
    .player-pick {
      display: flex; align-items: center; gap: 6px;
      background: var(--foam); border: 2px solid var(--ink); border-radius: 999px;
      padding: 4px 12px; font-size: .85rem; font-weight: 700; cursor: pointer;
      transition: background .12s;
    }
    .player-pick.is-picked-h { background: var(--azure); color: var(--paper); }
    .player-pick.is-picked-u { background: var(--sun); color: var(--ink); }
    .player-pick.is-picked-b { background: var(--coral); color: var(--paper); }

    /* ledertavle */
    .leaderboard { display: grid; gap: 10px; margin-top: 24px; }
    .lb-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--paper); border: var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 12px 18px;
    }
    .lb-rank { font-family: var(--font-display); font-size: 1.6rem; color: var(--azure); width: 36px; }
    .lb-name { flex: 1; font-weight: 800; font-size: 1.05rem; }
    .lb-score { font-family: var(--font-display); font-size: 1.4rem; color: var(--coral); }
    .lb-row:first-child { background: var(--sun); }

    /* fasit-panel */
    .fasit-panel {
      background: var(--foam); border: var(--border); border-radius: var(--radius);
      padding: 16px; margin-top: 10px; display: none;
    }
    .fasit-panel.is-open { display: block; }
  </style>
</head>
<body>
  <section class="section wrap">
    <h1 style="font-size:clamp(2.4rem,6vw,3.6rem);margin-bottom:6px">VM <em style="color:var(--coral)">tipping</em> ⚽</h1>
    <p class="muted" style="margin-bottom:28px"></p>

    <div id="matches"></div>

    <h2 style="font-size:1.8rem;margin:32px 0 16px">🏆 Ledertavle</h2>
    <div class="leaderboard" id="leaderboard"></div>
  </section>

  <script src="main.js"></script>
  <script>
  /* =====================================================================
     KAMPER — legg til / rediger her
     result: null = ikke spilt, "H" = hjemmelag vant, "U" = uavgjort, "B" = bortelag vant
     ===================================================================== */
  const MATCHES = [
    { id: "nor-sen", date: "Tir. 23/6 · 02:00", home: "Norge", away: "Senegal",   result: null },
    { id: "nor-fra", date: "Fre. 26/6 · 21:00", home: "Norge", away: "Frankrike", result: null },
    // legg til flere kamper her:
    // { id: "unik-id", date: "Dato · tid", home: "Lag 1", away: "Lag 2", result: null },
  ];

  const PLAYERS = ["Ann","Eli","Marei","Emmet","Rino","Tilde","Hæggi","Trusa","Skybert"];

  let tips = Store.seed("vm_tips", {}); // { matchId: { spillernavn: "H"/"U"/"B" } }
  const save = () => Store.set("vm_tips", tips);

  function renderMatches() {
    const el = document.getElementById("matches");
    el.innerHTML = MATCHES.map(m => {
      const mt = tips[m.id] || {};
      return `
        <div class="tip-card">
          <div class="tip-card__meta">⚽ ${m.date}</div>
          <div class="tip-card__teams">
            <span>${m.home}</span>
            <span style="font-size:.9rem;color:#41566b;font-family:var(--font-body)">vs</span>
            <span>${m.away}</span>
          </div>
          <div class="hub__label"><span>H</span><span>U</span><span>B</span></div>
          <div class="hub">
            ${["H","U","B"].map(x => `
              <div class="hub-btn ${m.result === x ? "is-correct" : ""}" style="pointer-events:none">${x}</div>`).join("")}
          </div>

          <div class="players-row">
            ${PLAYERS.map(p => {
              const pick = mt[p];
              const cls = pick === "H" ? "is-picked-h" : pick === "U" ? "is-picked-u" : pick === "B" ? "is-picked-b" : "";
              return `<button class="player-pick ${cls}" data-match="${m.id}" data-player="${p}">
                ${p} ${pick ? pick : "–"}
              </button>`;
            }).join("")}
          </div>

          <details style="margin-top:12px">
            <summary style="cursor:pointer;font-size:.85rem;font-weight:700;color:var(--blue)">⚙️ Legg inn tips / fasit</summary>
            <div class="fasit-panel is-open" style="margin-top:10px">
              <p style="font-size:.85rem;font-weight:700;margin-bottom:8px">Tips per person:</p>
              ${PLAYERS.map(p => `
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span style="width:70px;font-weight:700;font-size:.9rem">${p}</span>
                  ${["H","U","B"].map(x => `
                    <button class="hub-btn ${mt[p] === x ? "is-picked" : ""}"
                      style="padding:6px 14px;font-size:.85rem"
                      data-set-match="${m.id}" data-set-player="${p}" data-set-val="${x}">${x}</button>`).join("")}
                </div>`).join("")}
              <p style="font-size:.85rem;font-weight:700;margin:12px 0 6px">Fasit (admin):</p>
              <div style="display:flex;gap:8px">
                ${["H","U","B"].map(x => `
                  <button class="hub-btn ${m.result === x ? "is-correct" : ""}"
                    style="padding:8px 18px"
                    data-set-result="${m.id}" data-set-res-val="${x}">${x}</button>`).join("")}
                <button class="hub-btn" style="padding:8px 14px;font-size:.8rem"
                  data-set-result="${m.id}" data-set-res-val="null">Nullstill</button>
              </div>
            </div>
          </details>
        </div>`;
    }).join("");

    // tips per person
    el.querySelectorAll("[data-set-match]").forEach(b => {
      b.onclick = () => {
        const mid = b.dataset.setMatch, p = b.dataset.setPlayer, v = b.dataset.setVal;
        if (!tips[mid]) tips[mid] = {};
        tips[mid][p] = tips[mid][p] === v ? null : v;
        save(); renderMatches(); renderLeaderboard();
      };
    });

    // fasit
    el.querySelectorAll("[data-set-result]").forEach(b => {
      b.onclick = () => {
        const mid = b.dataset.setResult, v = b.dataset.setResVal;
        const match = MATCHES.find(m => m.id === mid);
        match.result = v === "null" ? null : v;
        save(); renderMatches(); renderLeaderboard();
      };
    });
  }

  function renderLeaderboard() {
    const scores = {};
    PLAYERS.forEach(p => scores[p] = 0);
    MATCHES.forEach(m => {
      if (!m.result) return;
      const mt = tips[m.id] || {};
      PLAYERS.forEach(p => { if (mt[p] === m.result) scores[p]++; });
    });
    const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
    document.getElementById("leaderboard").innerHTML = sorted.map(([name, score], i) => `
      <div class="lb-row">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-name">${name}</div>
        <div class="lb-score">${score} p</div>
      </div>`).join("");
  }

  renderMatches();
  renderLeaderboard();
  </script>
</body>
</html>
